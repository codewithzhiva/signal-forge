services:
  api:
    build: .
    volumes: [signal-data:/data]
    ports: ["8000:8000"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"], interval: 5s, timeout: 2s, retries: 10}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  redpanda:
    image: redpandadata/redpanda:v25.1.4
    command: ["redpanda", "start", "--mode", "dev-container", "--smp", "1", "--memory", "512M", "--overprovisioned"]
  web:
    build: ./web
    ports: ["8081:80"]
    depends_on: {api: {condition: service_healthy}}
volumes: {signal-data: {}}
