[project]
name = "signal-forge"
version = "0.1.0"
description = "Explainable, versioned real-time risk decisions"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.11,<1", "mypy>=1.15,<3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
